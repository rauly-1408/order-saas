# Comprobaciones automáticas en cada PR y en main: lint, tipos y pruebas.
# Sin base de datos ni claves: solo lógica pura. Ver docs/OPERACIONES.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
